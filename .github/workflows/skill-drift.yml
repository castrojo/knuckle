name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@b5e70b44cbcfc0a02004abbc90342a523cbc716f # v1
    with:
      code-paths: '[".github/workflows/**", "cmd/**", "internal/**", "Justfile", "scripts/**"]'
      skill-paths: '["docs/**/*.md", "AGENTS.md"]'
