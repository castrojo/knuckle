name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@9d2d1cbe192f9058b7a71d98de34ce8b2d515a65 # v1
    with:
      code-paths: '[".github/workflows/**", "cmd/**", "internal/**", "Justfile", "scripts/**"]'
      skill-paths: '["docs/**/*.md", "AGENTS.md"]'
