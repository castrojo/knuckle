name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@d8f871c0ca7a868339d3c175200a7319492473c7 # v1
    with:
      code-paths: '[".github/workflows/**", "cmd/**", "internal/**", "Justfile", "scripts/**"]'
      skill-paths: '["docs/**/*.md", "AGENTS.md"]'
