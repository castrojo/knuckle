name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@ffd910302f180a4a903012689676c76cad70de75 # v1
    with:
      code-paths: '[".github/workflows/**", "cmd/**", "internal/**", "Justfile", "scripts/**"]'
      skill-paths: '["docs/**/*.md", "AGENTS.md"]'
