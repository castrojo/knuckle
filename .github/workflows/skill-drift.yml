name: Skill Drift

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  skill-drift:
    uses: projectbluefin/actions/.github/workflows/skill-drift-check.yml@8fd476d7ad4023d3bcb56481407913fd6cf73f60 # v1
    with:
      code-paths: '[".github/workflows/**", "cmd/**", "internal/**", "Justfile", "scripts/**"]'
      skill-paths: '["docs/**/*.md", "AGENTS.md"]'
