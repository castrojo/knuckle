name: bonedigger

on:
  issues:
    types: [opened, labeled, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 9 * * *'

permissions:
  issues: write
  contents: read

jobs:
  bonedigger:
    uses: projectbluefin/bonedigger/.github/workflows/lifecycle.yml@30a240ea9163790fe9c1f24b2c6ce65af4a71798 # main
    with:
      brand_name: "Bluefin"
      brand_emoji: "🦖"
    secrets: inherit
