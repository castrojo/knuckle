name: Nightly Tests

on:
  schedule:
    # Run daily at 03:00 UTC to catch regressions from dep updates
    - cron: "0 3 * * *"
  workflow_dispatch: # allow manual triggers for debugging

permissions:
  contents: read

jobs:
  nightly-test:
    name: nightly test (-race, 10x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: extended flaky detection (10 iterations)
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Running tests 10x with -race to detect flaky tests..."
          failures=0
          for i in {1..10}; do
            echo "::group::Run $i/10"
            if ! go test -race -count=1 ./... 2>&1; then
              echo "::endgroup::"
              echo "::error::Run $i FAILED"
              failures=$((failures + 1))
            else
              echo "::endgroup::"
            fi
          done
          if [[ $failures -gt 0 ]]; then
            echo "::error::$failures/10 runs failed — flaky or regressed tests detected"
            exit 1
          fi
          echo "✓ All 10 runs passed"

  nightly-coverage:
    name: nightly coverage snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
          check-latest: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just-action
      - name: install just (fallback)
        if: steps.setup-just-action.outcome == 'failure'
        run: curl -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: per-package coverage gate
        run: just cover-check

      - name: aggregate coverage profile
        run: go test -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-coverage-${{ github.run_number }}
          path: cover.out
          retention-days: 30

      - name: upload to Codecov (nightly flag)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: ./cover.out
          flags: nightly
          fail_ci_if_error: false

  nightly-vuln:
    name: nightly govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan for new advisories
        run: $(go env GOPATH)/bin/govulncheck ./...

  nightly-integration:
    name: nightly integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: run integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -race -count=1 -v -tags=integration ./...
